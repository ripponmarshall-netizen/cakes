<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/partner.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Partner" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f0e8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Pick the theme before first paint so dark mode never flashes light.
      // Mirrors src/hooks/useTheme.ts.
      ;(function () {
        var pref = 'system'
        try {
          pref = JSON.parse(localStorage.getItem('pl:v2:pref:theme')) || 'system'
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name=theme-color]').content = dark ? '#0e100e' : '#f3f0e8'
      })()
    </script>
    <meta name="description" content="Track partner hands, monthly contributions, the pot and every draw." />
    <title>Partner Ledger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
