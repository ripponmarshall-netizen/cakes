<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/partner.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Partner" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f7" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Pick the theme before first paint so dark mode never flashes light.
      // Mirrors src/hooks/useTheme.ts.
      ;(function () {
        var pref = 'system'
        try {
          pref = JSON.parse(localStorage.getItem('pl:v2:pref:theme')) || 'system'
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name=theme-color]').content = dark ? '#161513' : '#faf9f7'
      })()
    </script>
    <!--
      Loading screen, after the Night Shift Calculator's. Inline (not in the
      bundle) so it's styled before any script arrives. While the app loads,
      the three member dots turn around the circle. When the app has a screen
      (App.tsx calls plSplashDone), the turn settles, the tile and ring draw
      themselves in behind the dots, then the logo and title fly onto the
      header's own (FLIP) while the page drops in beneath them.
    -->
    <style>
      .pl-splash {
        --pl-bg: #faf9f7;
        --pl-ink: #1a1815;
        --pl-faint: #767368;
        --pl-line: #d8d4cb;
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px;
        background: var(--pl-bg);
        color: var(--pl-ink);
        font-family: 'Geist Variable', 'Geist', -apple-system, system-ui, sans-serif;
        transition:
          opacity 0.45s ease,
          visibility 0s linear 0.45s,
          background-color 0.5s ease;
      }
      [data-theme='dark'] .pl-splash {
        --pl-bg: #161513;
        --pl-ink: #f5f3ee;
        --pl-faint: #7f7b71;
        --pl-line: #36342e;
      }
      .pl-splash.is-flying {
        background-color: transparent;
        pointer-events: none;
      }
      .pl-splash.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .pl-brand {
        position: relative;
        width: 96px;
        height: 96px;
        margin-bottom: 14px;
      }
      .pl-brand svg {
        position: absolute;
        inset: 0;
        display: block;
        overflow: visible;
      }
      .pl-glow {
        position: absolute;
        inset: -28px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(202, 101, 60, 0.38), transparent 68%);
        opacity: 0;
      }
      .pl-tile {
        opacity: 0;
        transform: scale(0.6);
        transform-box: fill-box;
        transform-origin: center;
      }
      .pl-ring {
        stroke-dasharray: 107;
        stroke-dashoffset: 107;
      }
      .pl-track {
        transition: opacity 0.3s ease;
      }
      .pl-orbit {
        transform-origin: 50% 50%;
        animation: plSpin 1.4s linear infinite;
      }
      .pl-dot {
        fill: var(--pl-ink);
        stroke: var(--pl-bg);
        transition:
          fill 0.35s ease,
          stroke 0.35s ease;
      }
      .pl-dot.is-turn {
        fill: #e0a43c;
      }
      .pl-splash.is-ready .pl-tile {
        animation: plLogoIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      .pl-splash.is-ready .pl-ring {
        animation: plDraw 0.7s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards;
      }
      .pl-splash.is-ready .pl-track {
        opacity: 0;
      }
      .pl-splash.is-ready .pl-dot {
        fill: #f4f4f5;
        stroke: #0b0b0c;
        transition-delay: 0.12s;
      }
      .pl-splash.is-ready .pl-dot.is-turn {
        fill: #e0a43c;
      }
      .pl-splash.is-ready .pl-glow {
        animation: plGlow 1.1s ease-out 0.2s forwards;
      }
      .pl-splash.is-flying .pl-glow {
        animation: plGlowOut 0.3s ease-out forwards;
      }
      .pl-splash-sub {
        font-size: 13px;
        color: var(--pl-faint);
        transition: opacity 0.3s ease;
      }
      .pl-splash.is-ready .pl-splash-sub {
        opacity: 0;
      }
      /* Matches the header title, which it turns into. */
      .pl-splash-title {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        transform-origin: left center;
      }
      /* The header's own logo and title stay hidden until the splash copies
         land on them, so the swap is invisible. */
      .pl-booting [data-splash-target],
      .pl-handoff [data-splash-target] {
        visibility: hidden;
      }
      .pl-landed {
        animation: plLand 0.42s ease-out;
      }
      /* While the splash is up, screen entrances wait, so the cards come in as
         it lifts rather than hidden underneath it. On that first entrance
         (.pl-intro) they fall into place from above, a little slower and more
         staggered, as if dropping out of the header the logo just flew into. */
      .pl-booting #root * {
        animation-play-state: paused !important;
      }
      .pl-intro {
        --rise-from: -18px;
        --rise-dur: 0.65s;
        --rise-step: 0.08s;
      }
      @keyframes plSpin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes plLogoIn {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes plDraw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes plGlow {
        0% {
          opacity: 0;
          transform: scale(0.7);
        }
        45% {
          opacity: 1;
        }
        100% {
          opacity: 0.55;
          transform: none;
        }
      }
      @keyframes plGlowOut {
        from {
          opacity: 0.55;
        }
        to {
          opacity: 0;
          transform: scale(0.6);
        }
      }
      @keyframes plLand {
        40% {
          transform: scale(1.1);
        }
      }
      /* Reduced motion: no turning; the finished logo, then a plain fade. */
      @media (prefers-reduced-motion: reduce) {
        .pl-orbit {
          animation: none;
        }
        .pl-tile {
          opacity: 1;
          transform: none;
        }
        .pl-ring {
          stroke-dashoffset: 0;
        }
        .pl-splash.is-ready .pl-tile,
        .pl-splash.is-ready .pl-ring,
        .pl-splash.is-ready .pl-glow {
          animation: none;
        }
      }
    </style>
    <script>
      ;(function () {
        var start = Date.now()
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches
        var root = document.documentElement
        root.classList.add('pl-booting', 'pl-intro')
        var slow = setTimeout(function () {
          var sub = document.getElementById('pl-splash-sub')
          if (sub) sub.textContent = 'Still loading… check your connection'
        }, 12000)
        var later = function (fn, ms) {
          setTimeout(fn, reduce ? Math.min(ms, 350) : ms)
        }
        var finish = function (el) {
          root.classList.remove('pl-booting', 'pl-handoff')
          if (el) el.remove()
          // The intro entrance has played; later screens rise as usual.
          later(function () {
            root.classList.remove('pl-intro')
          }, 1400)
        }
        var rect = function (n) {
          var r = n && n.getBoundingClientRect()
          return r && r.width > 0 && r.height > 0 ? r : null
        }

        // Ease the turning dots to a stop exactly where the logo has them,
        // then call next. Falls back to stopping at once if the browser can't
        // read or animate the rotation.
        var settle = function (el, next) {
          var orbit = el.querySelector('.pl-orbit')
          if (reduce || !orbit || !orbit.animate || !window.DOMMatrix) return next()
          try {
            var m = new DOMMatrix(getComputedStyle(orbit).transform)
            var deg = (Math.atan2(m.b, m.a) * 180) / Math.PI
            if (deg < 0) deg += 360
            // At least half a turn more, so it visibly winds down.
            var to = deg > 180 ? 720 : 360
            orbit.style.animation = 'none'
            orbit.style.transform = 'none'
            var ms = Math.round(Math.max(520, Math.min(900, (to - deg) * 1.6)))
            orbit.animate([{ transform: 'rotate(' + deg + 'deg)' }, { transform: 'rotate(' + to + 'deg)' }], {
              duration: ms,
              easing: 'cubic-bezier(0.2, 0.7, 0.25, 1)',
            })
            setTimeout(next, Math.max(0, ms - 160))
          } catch (e) {
            next()
          }
        }

        // Fly the splash logo and title onto the header's logo and title
        // (FLIP: measure both, animate the difference), dropping the splash
        // backdrop so the page comes in underneath. If there's nothing to land
        // on, fade the splash out as a whole instead.
        var flyHome = function (el) {
          var brand = el.querySelector('.pl-brand')
          var title = el.querySelector('.pl-splash-title')
          var toLogo = null
          var logos = document.querySelectorAll('[data-splash-target=logo]')
          for (var i = 0; i < logos.length && !toLogo; i++) if (rect(logos[i])) toLogo = logos[i]
          var toTitle = document.querySelector('[data-splash-target=title]')
          var a = rect(brand)
          var b = rect(toLogo)
          if (reduce || !a || !b || !brand.animate) {
            el.classList.add('is-leaving')
            el.setAttribute('aria-hidden', 'true')
            root.classList.remove('pl-booting')
            later(function () {
              finish(el)
            }, 450)
            return
          }
          var ms = 720
          var ease = 'cubic-bezier(0.45, 0, 0.15, 1)'
          var s = b.width / a.width
          var dx = b.left + b.width / 2 - (a.left + a.width / 2)
          var dy = b.top + b.height / 2 - (a.top + a.height / 2)
          root.classList.add('pl-handoff')
          el.classList.add('is-flying')
          el.setAttribute('aria-hidden', 'true')
          var flight = brand.animate(
            [{ transform: 'none' }, { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(' + s + ')' }],
            { duration: ms, easing: ease, fill: 'forwards' },
          )
          var c = rect(title)
          var d = rect(toTitle)
          if (c && d) {
            // The header title is left-aligned and may be a little smaller
            // (it scales with the screen), so pin the left edge.
            var ts = parseFloat(getComputedStyle(toTitle).fontSize) / parseFloat(getComputedStyle(title).fontSize)
            title.animate(
              [
                { transform: 'none' },
                { transform: 'translate(' + (d.left - c.left) + 'px, ' + (d.top + d.height / 2 - (c.top + c.height / 2)) + 'px) scale(' + ts + ')' },
              ],
              { duration: ms, easing: ease, fill: 'forwards' },
            )
          } else {
            title.style.transition = 'opacity 0.3s ease'
            title.style.opacity = '0'
          }
          // Let the page start falling in once the logo is most of the way
          // up, so the cards don't fade in underneath it as it passes.
          setTimeout(function () {
            root.classList.remove('pl-booting')
          }, ms * 0.55)
          // Swap to the real logo on the flight's last frame (a timer alone
          // can fire a frame early); the timer is the backstop.
          var landed = false
          var land = function () {
            if (landed) return
            landed = true
            finish(el)
            toLogo.classList.add('pl-landed')
          }
          flight.onfinish = land
          setTimeout(land, ms + 250)
        }

        window.plSplashDone = function () {
          window.plSplashDone = function () {}
          clearTimeout(slow)
          var el = document.getElementById('pl-splash')
          if (!el) return finish(null)
          // Let the dots make most of a turn on a fast load.
          var wait = reduce ? 0 : Math.max(0, 900 - (Date.now() - start))
          setTimeout(function () {
            settle(el, function () {
              el.classList.add('is-ready')
              el.setAttribute('aria-busy', 'false')
              later(function () {
                flyHome(el)
              }, 1000)
            })
          }, wait)
        }
      })()
    </script>
    <meta name="description" content="Track partner hands, monthly contributions, the pot and every draw." />
    <title>Partner Ledger</title>
  </head>
  <body>
    <!-- An overlay above the app (not inside #root), so it can hand over to the header after React mounts. -->
    <div id="pl-splash" class="pl-splash" role="status" aria-busy="true">
      <div class="pl-brand" aria-hidden="true">
        <span class="pl-glow"></span>
        <!-- The tile and ring of the app icon (src/components/Logo.tsx), drawn in once loaded. -->
        <svg viewBox="0 0 64 64" width="96" height="96">
          <rect class="pl-tile" width="64" height="64" rx="14" fill="#0b0b0c" />
          <circle class="pl-ring" cx="32" cy="32" r="17" fill="none" stroke="#f4f4f5" stroke-width="3.5" transform="rotate(-90 32 32)" />
        </svg>
        <!-- The member dots: they turn while loading and stop where the icon has them. -->
        <svg viewBox="0 0 64 64" width="96" height="96">
          <circle class="pl-track" cx="32" cy="32" r="17" fill="none" stroke="var(--pl-line)" stroke-width="2" stroke-dasharray="3 4" />
          <g class="pl-orbit" stroke-width="2.5">
            <circle class="pl-dot is-turn" cx="32" cy="15" r="5.5" />
            <circle class="pl-dot" cx="46.72" cy="40.5" r="5.5" />
            <circle class="pl-dot" cx="17.28" cy="40.5" r="5.5" />
          </g>
        </svg>
      </div>
      <div class="pl-splash-title">Partner Ledger</div>
      <div class="pl-splash-sub" id="pl-splash-sub">Loading…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
